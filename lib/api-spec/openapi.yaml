    Unit:
      type: object
      required: [id, subjectId, band, titleAr, titleEn, position, status]
      properties:
        id: { type: integer }
        subjectId: { type: integer }
        band: { $ref: "#/components/schemas/Band" }
        titleAr: { type: string }
        titleEn: { type: string }
        position: { type: integer }
        status: { type: string, description: draft | published }
    UnitInput:
      type: object
