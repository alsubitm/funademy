        titleAr: { type: string }
        titleEn: { type: string }
        descriptionAr: { type: string }
        descriptionEn: { type: string }
        videoUrl: { type: string }
        videoType: { type: string, description: youtube | vimeo | mp4 }
        durationMinutes: { type: integer }
        position: { type: integer }
        status: { type: string }
        isFreeSample: { type: boolean }
        subjectId: { type: ["integer", "null"] }
        subjectNameAr: { type: ["string", "null"] }
        unitTitleAr: { type: ["string", "null"] }
        exercises:
          type: array
          items: { $ref: "#/components/schemas/Exercise" }
    Exercise:
      type: object
      required: [id, lessonId, type, promptAr, promptEn, options, correctAnswer, position]
      properties:
        id: { type: integer }
