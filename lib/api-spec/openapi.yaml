        type:
          type: string
          description: multiple_choice | matching | fill_blank | picture_select
        promptAr: { type: string }
        promptEn: { type: string }
        options:
          type: array
          description: answer options; for picture_select each option is an emoji/label
          items: { type: string }
        correctAnswer: { type: string }
        position: { type: integer }
    ExerciseInput:
      type: object
      required: [type, promptAr, promptEn, options, correctAnswer]
      properties:
        type: { type: string }
        promptAr: { type: string }
        promptEn: { type: string }
        options:
          type: array
          items: { type: string }
        correctAnswer: { type: string }
        position: { type: ["integer", "null"] }
    LessonInput:
      type: object
      required: [unitId, titleAr, titleEn, descriptionAr, descriptionEn, videoUrl, videoType, durationMinutes]
      properties:
        unitId: { type: integer }
        titleAr: { type: string }
        titleEn: { type: string }
        descriptionAr: { type: string }
        descriptionEn: { type: string }
        videoUrl: { type: string }
        videoType: { type: string }
        durationMinutes: { type: integer }
        isFreeSample: { type: ["boolean", "null"] }
        status: { type: ["string", "null"] }
        position: { type: ["integer", "null"] }
        exercises:
          type: array
          items: { $ref: "#/components/schemas/ExerciseInput" }
    LessonUpdate:
      type: object
      properties:
        titleAr: { type: string }
        titleEn: { type: string }
        descriptionAr: { type: string }
