<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 80" role="img" aria-label="e² Young Engineers">
  <!-- Background shield shape -->
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C54CB"/>
      <stop offset="100%" stop-color="#091D52"/>
    </linearGradient>
  </defs>

  <!-- e² mark — bold block with superscript -->
  <g transform="translate(0,0)">
    <!-- The "e" letter block -->
    <rect x="4" y="16" width="56" height="48" rx="6" fill="url(#shieldGrad)"/>
    <!-- Horizontal bars of the "E" -->
    <rect x="14" y="26" width="36" height="7" rx="2" fill="#FFCA17"/>
    <rect x="14" y="36.5" width="28" height="6" rx="2" fill="#FFCA17"/>
    <rect x="14" y="47" width="36" height="7" rx="2" fill="#FFCA17"/>
    <!-- Superscript 2 -->
    <rect x="56" y="8" width="20" height="20" rx="4" fill="#22DAFF"/>
    <text x="66" y="23" font-family="'IBM Plex Mono', monospace" font-weight="700" font-size="13" fill="#091D52" text-anchor="middle">2</text>
  </g>

  <!-- Divider line -->
  <line x1="92" y1="18" x2="92" y2="62" stroke="rgba(28,84,203,0.25)" stroke-width="1.5"/>

  <!-- "YOUNG ENGINEERS" wordmark -->
  <g font-family="'IBM Plex Mono', 'Courier New', monospace" font-weight="700" fill="#091D52">
    <text x="104" y="36" font-size="12.5" letter-spacing="0.12em">YOUNG</text>
    <text x="104" y="55" font-size="12.5" letter-spacing="0.06em">ENGINEERS</text>
  </g>

  <!-- Accent dot -->
  <circle cx="207" cy="16" r="4" fill="#FFCA17"/>
</svg>
