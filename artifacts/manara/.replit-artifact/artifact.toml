kind = "web"
previewPath = "/"
title = "Manara Academy | أكاديمية منارة"
description = "An Arabic-first, RTL subscription e-learning platform for Saudi families with children aged 4-18. Includes a marketing website, parent accounts with child profiles (avatar + PIN), age-banded learning experiences, video lessons with auto-graded exercises, XP/streaks/badges, a parent progress dashboard, and teacher/admin panels."
version = "1.0.0"
id = "artifacts/manara"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25425

[services.development]
run = "pnpm --filter @workspace/manara run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/manara", "run", "build" ]
serve = "static"
publicDir = "artifacts/manara/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25425"
BASE_PATH = "/"
