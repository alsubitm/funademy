kind = "web"
previewPath = "/watanona-legacy/"
title = "أطفالنا يبنون وطننا — Watanona (legacy)"
description = "Legacy standalone version of the 'Our Kids Build Our Homeland' campaign page. Superseded by the /watanona page inside the Young Engineers Riyadh North website (artifacts/ye); kept for reference and in-flight task merges."
version = "1.0.0"
id = "artifacts/watanona"
router = "path"

[[services]]
name = "web"
paths = [ "/watanona-legacy/" ]
localPort = 24563

[services.development]
run = "pnpm --filter @workspace/watanona run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/watanona", "run", "build" ]
serve = "static"
publicDir = "artifacts/watanona/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24563"
BASE_PATH = "/watanona-legacy/"
